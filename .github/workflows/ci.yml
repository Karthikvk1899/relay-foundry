name: CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pip-audit
      - run: ruff check relay tests
      - run: pytest -q --cov=relay --cov-report=term-missing tests/test_security.py tests/test_delivery.py
  console:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start stack
        run: |
          printf 'API_KEY=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build
      - name: Exercise complete delivery path
        run: |
          docker compose --profile test up -d --wait receiver
          docker compose --profile test run --rm --no-deps integration || {
            docker compose --profile test logs --no-color --tail=120 api publisher consumer sender receiver
            exit 1
          }
      - name: Diagnostics on failure
        if: failure()
        run: docker compose --profile test logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
