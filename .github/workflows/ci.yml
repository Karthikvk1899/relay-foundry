name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e '.[test]'
      - run: ruff check relay tests
      - run: pytest -q --cov=relay --cov-report=term-missing tests/test_security.py
  console:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          printf 'API_KEY=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build
      - name: Exercise complete delivery path
        run: |
          docker compose --profile test up -d receiver
          docker compose --profile test run --rm --no-deps integration
      - name: Diagnostics on failure
        if: failure()
        run: docker compose --profile test logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
