[project]
name = "relay-foundry"
version = "0.1.0"
description = "Durable, multi-tenant webhook delivery"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "psycopg[binary,pool]==3.2.6", "confluent-kafka==2.8.2", "httpx==0.28.1", "pydantic-settings==2.8.1"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-cov==6.1.1", "respx==0.22.0", "ruff==0.11.5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay"]

[tool.setuptools.package-data]
relay = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

