server {
    listen 80;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    location /v1/ { proxy_pass http://api:8080; proxy_set_header Authorization $http_authorization; proxy_set_header Idempotency-Key $http_idempotency_key; }
    location / { try_files $uri $uri/ /index.html; }
}
